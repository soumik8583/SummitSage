<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Treks | Summit Sage Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1628">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230A1628'/%3E%3Cpath d='M8 34L19 15l6 9 3-5 12 15H8z' fill='%23E85D04'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="/js/admin-treks.js"></script>
</head>
<body>
  <div>
    <header class="admin-topbar">
      <a href="/" class="brand" aria-label="Summit Sage home">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#0A1628"/><path d="M8 34L19 15l6 9 3-5 12 15H8z" fill="#E85D04"/><path d="M19 15l6 9 3-5 3.6 4.5L27 24l-4 3-4-6-3.5 6H10L19 15z" fill="#fff" opacity=".92"/><circle cx="35" cy="13" r="3.2" fill="#fff"/></svg>
        <span>Summit<span class="b-sage">Sage</span> Admin</span>
      </a>
      <div class="spacer"></div>
      <span class="admin-who" id="adminWho"></span>
      <a class="btn btn-outline btn-sm" href="/admin"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <button class="btn btn-primary btn-sm" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </header>

    <main class="admin-main">
      <h1 style="font-size:1.6rem">Manage treks</h1>
      <p class="muted" style="margin:6px 0 22px">Add treks here and they appear instantly in the public <a href="/treks" target="_blank" rel="noopener">trek list</a>.</p>

      <div class="admin-stats" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));max-width:340px">
        <div class="admin-stat"><div class="n" id="statTreks">—</div><div class="l">Treks published</div></div>
      </div>

      <div class="admin-msg" id="trekMsg" role="alert"></div>

      <div class="card" style="margin-bottom:34px">
        <h2 style="font-size:1.3rem;margin-bottom:16px">Add a new trek</h2>
        <form id="trekForm" novalidate>
          <div class="form-row">
            <div class="form-group"><label>Trek name <span class="req">*</span></label><input class="control" name="name" required></div>
            <div class="form-group"><label>Region</label><input class="control" name="region" placeholder="e.g. Uttarakhand"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Base town</label><input class="control" name="base" placeholder="e.g. Sankri"></div>
            <div class="form-group"><label>Difficulty</label>
              <select class="control" name="difficulty">
                <option>Easy</option>
                <option selected>Moderate</option>
                <option>Challenging</option>
                <option>Extreme</option>
              </select>
            </div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Season</label><input class="control" name="season" placeholder="e.g. Winter"></div>
            <div class="form-group"><label>Duration (days)</label><input class="control" type="number" name="days" min="1" placeholder="6"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Distance (km)</label><input class="control" type="number" name="distanceKm" min="0" placeholder="20"></div>
            <div class="form-group"><label>Max altitude (m)</label><input class="control" type="number" name="maxAltitude" min="0" placeholder="3810"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Price (₹) <span class="req">*</span></label><input class="control" type="number" name="price" min="0" required placeholder="9500"></div>
            <div class="form-group"><label>Early-bird price (₹)</label><input class="control" type="number" name="earlyBird" min="0" placeholder="8100"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Total seats</label><input class="control" type="number" name="totalSeats" min="1" placeholder="24"></div>
            <div class="form-group"><label>Seats left</label><input class="control" type="number" name="seatsLeft" min="0" placeholder="12"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Start date</label><input class="control" type="date" name="startDate"></div>
            <div class="form-group"><label>Rating (0–5)</label><input class="control" type="number" name="rating" min="0" max="5" step="0.1" placeholder="4.9"></div>
          </div>
          <div class="form-group"><label>Image URL</label><input class="control" name="image" placeholder="https://…"></div>
          <div class="form-group"><label>Tags (comma-separated)</label><input class="control" name="tags" placeholder="Snow trek, Summit, Beginner-friendly"></div>
          <div class="form-group"><label>Short blurb (shown on the card)</label><textarea class="control" name="blurb" rows="2" placeholder="One-line summary that hooks the reader."></textarea></div>
          <div class="form-group"><label>Full description</label><textarea class="control" name="description" rows="4" placeholder="Detailed description of the trek…"></textarea></div>
          <div class="form-group"><label>Highlights (one per line)</label><textarea class="control" name="highlights" rows="3" placeholder="Classic snow summit&#10;Camp beside frozen meadows&#10;Sunrise over the range"></textarea></div>
          <button class="btn btn-primary btn-block btn-lg" type="submit"><i class="fa-solid fa-plus"></i> Add trek</button>
        </form>
      </div>

      <h2 style="font-size:1.3rem;margin:0 0 6px">Published treks</h2>
      <p class="muted" style="margin:0 0 16px">These are live on the public trek list.</p>
      <div class="admin-table-wrap">
        <table class="admin-table" style="min-width:640px">
          <thead>
            <tr>
              <th>Name</th>
              <th>Region</th>
              <th>Difficulty</th>
              <th>Price</th>
              <th>Link</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="trekListBody">
            <tr><td colspan="6" class="admin-empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>
</body>
</html>
