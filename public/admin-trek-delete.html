<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delete / Abandon Trek | Summit Sage Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1628">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230A1628'/%3E%3Cpath d='M8 34L19 15l6 9 3-5 12 15H8z' fill='%23E85D04'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/js/theme.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Summit Sage">
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="/js/admin-trek-delete.js"></script>
</head>
<body>
  <div>
    <header class="admin-topbar">
      <a href="/" class="brand" aria-label="Summit Sage home">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#0A1628"/><path d="M8 34L19 15l6 9 3-5 12 15H8z" fill="#E85D04"/><path d="M19 15l6 9 3-5 3.6 4.5L27 24l-4 3-4-6-3.5 6H10L19 15z" fill="#fff" opacity=".92"/><circle cx="35" cy="13" r="3.2" fill="#fff"/></svg>
        <span>Summit<span class="b-sage">Sage</span> Admin</span>
      </a>
      <div class="spacer"></div>
      <span class="admin-who" id="adminWho"></span>
      <a class="btn btn-outline btn-sm" href="/admin"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <button class="btn btn-primary btn-sm" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </header>

    <main class="admin-main" style="max-width:640px">
      <h1 style="font-size:1.6rem">Delete / Abandon trek</h1>
      <p class="muted" style="margin:6px 0 22px"><b>Abandon</b> hides a trek from the public trek list (it stays in the database). <b>Delete</b> removes it permanently.</p>

      <div class="admin-msg" id="trekMsg" role="alert"></div>

      <div class="card" style="margin-bottom:26px">
        <div class="form-group" style="margin-bottom:0">
          <label for="trekSelect">Select trek</label>
          <select class="control" id="trekSelect">
            <option value="">— Choose a trek —</option>
          </select>
        </div>
      </div>

      <div class="card" id="actionSection" style="display:none">
        <h2 style="font-size:1.2rem;margin-bottom:4px" id="trekName">—</h2>
        <p class="muted" id="trekStatus" style="margin:0 0 20px;font-size:.9rem"></p>
        <div class="flex gap-1 wrap">
          <button class="btn btn-outline" id="abandonBtn" type="button"><i class="fa-solid fa-eye-slash"></i> Abandon (hide)</button>
          <button class="btn btn-outline" id="restoreBtn" type="button" style="display:none"><i class="fa-solid fa-eye"></i> Restore (show)</button>
          <button class="btn btn-whatsapp" id="deleteBtn" type="button" style="background:#d33;color:#fff"><i class="fa-solid fa-trash"></i> Delete permanently</button>
        </div>
      </div>
    </main>
  </div>
  <footer class="site-copy">copyright@soumikmondal723</footer>
</body>
</html>
