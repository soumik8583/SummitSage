<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Trek | Summit Sage Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1628">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230A1628'/%3E%3Cpath d='M8 34L19 15l6 9 3-5 12 15H8z' fill='%23E85D04'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/js/theme.js"></script>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Summit Sage">
  <link rel="stylesheet" href="/css/styles.css">
  <script defer src="/js/admin-trek-add.js"></script>
</head>
<body>
  <div>
    <header class="admin-topbar">
      <a href="/" class="brand" aria-label="Summit Sage home">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#0A1628"/><path d="M8 34L19 15l6 9 3-5 12 15H8z" fill="#E85D04"/><path d="M19 15l6 9 3-5 3.6 4.5L27 24l-4 3-4-6-3.5 6H10L19 15z" fill="#fff" opacity=".92"/><circle cx="35" cy="13" r="3.2" fill="#fff"/></svg>
        <span>Summit<span class="b-sage">Sage</span> Admin</span>
      </a>
      <div class="spacer"></div>
      <span class="admin-who" id="adminWho"></span>
      <a class="btn btn-outline btn-sm" href="/admin"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
      <button class="btn btn-primary btn-sm" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
    </header>

    <main class="admin-main" style="max-width:760px">
      <h1 style="font-size:1.6rem">Add new trek</h1>
      <p class="muted" style="margin:6px 0 22px">These details are saved to the <b>Trek</b> table and appear instantly in the public <a href="/treks" target="_blank" rel="noopener">trek list</a>.</p>

      <div class="admin-msg" id="trekMsg" role="alert"></div>

      <div class="card">
        <form id="trekForm" novalidate>
          <div class="form-group"><label>Trek name <span class="req">*</span></label><input class="control" name="name" required></div>
          <div class="form-row">
            <div class="form-group"><label>Trek location</label><input class="control" name="location" placeholder="e.g. Uttarakhand"></div>
            <div class="form-group"><label>Altitude (m)</label><input class="control" type="number" name="altitude" min="0" placeholder="3810"></div>
          </div>
          <div class="form-group"><label>Trek details</label><textarea class="control" name="details" rows="4" placeholder="Describe the trek — route, experience, what to expect…"></textarea></div>
          <div class="form-row">
            <div class="form-group"><label>Trek start date</label><input class="control" type="date" name="startDate"></div>
            <div class="form-group"><label>Trek end date</label><input class="control" type="date" name="endDate"></div>
          </div>
          <div class="form-group"><label>Trek price (₹) <span class="req">*</span></label><input class="control" type="number" name="price" min="0" required placeholder="9500"></div>
          <div class="form-row">
            <div class="form-group"><label>Total seats</label><input class="control" type="number" name="totalSeats" min="0" placeholder="24"></div>
            <div class="form-group"><label>Booked seats</label><input class="control" type="number" name="bookedSeats" min="0" value="0" placeholder="0"></div>
          </div>
          <div class="form-group"><label>Available seats <span class="muted" style="font-weight:400">(auto)</span></label><input class="control" type="number" name="availableSeats" readonly></div>
          <div class="form-group">
            <label>Trek image</label>
            <input class="control" type="file" name="imageFile" accept="image/*" id="imageFile">
            <p class="muted" style="font-size:.8rem;margin-top:6px">JPG/PNG. Large images are automatically resized.</p>
            <img id="imagePreview" alt="Preview" style="display:none;margin-top:12px;max-width:100%;border-radius:12px;border:1px solid var(--line)">
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit"><i class="fa-solid fa-plus"></i> Add trek</button>
        </form>
      </div>
    </main>
  </div>
  <footer class="site-copy">copyright@soumikmondal723</footer>
</body>
</html>
