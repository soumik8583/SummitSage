<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Summit Sage</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a1628">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%230A1628'/%3E%3Cpath d='M8 34L19 15l6 9 3-5 12 15H8z' fill='%23E85D04'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script defer src="/js/admin.js"></script>
</head>
<body>
  <div class="admin-wrap">
    <div class="admin-card">
      <a href="/" class="brand" aria-label="Summit Sage home">
        <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true"><rect width="48" height="48" rx="13" fill="#0A1628"/><path d="M8 34L19 15l6 9 3-5 12 15H8z" fill="#E85D04"/><path d="M19 15l6 9 3-5 3.6 4.5L27 24l-4 3-4-6-3.5 6H10L19 15z" fill="#fff" opacity=".92"/><circle cx="35" cy="13" r="3.2" fill="#fff"/></svg>
        <span>Summit<span class="b-sage">Sage</span></span>
      </a>
      <h1>Admin sign in</h1>
      <p class="admin-sub">Access the Summit Sage control room.</p>

      <div class="admin-msg" id="adminMsg" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="admin-field">
          <label for="email">Email</label>
          <input class="control" id="email" type="email" name="email" required autocomplete="username">
        </div>
        <div class="admin-field">
          <label for="password">Password</label>
          <input class="control" id="password" type="password" name="password" required autocomplete="current-password">
        </div>
        <button class="btn btn-primary btn-block btn-lg" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button>
      </form>

      <div id="googleWrap">
        <div class="wa-or">or</div>
        <div id="googleBtn"></div>
      </div>

      <p class="admin-alt">New admin? <a href="/admin-signup">Create an account</a></p>
    </div>
  </div>
</body>
</html>
