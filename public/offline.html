<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Summit Sage</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0a1628">
  <link rel="icon" href="/icons/icon-192.png">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center">
    <div style="max-width:460px">
      <div style="font-size:3rem;margin-bottom:8px">⛰️</div>
      <h1 style="font-size:1.6rem;margin-bottom:10px">You're offline</h1>
      <p class="muted" style="margin-bottom:22px">We can't reach the trail right now. Check your connection and try again — cached pages will still open.</p>
      <button class="btn btn-primary" onclick="location.reload()"><i class="fa-solid fa-rotate"></i> Retry</button>
      <p style="margin-top:26px"><a href="/" style="color:var(--orange-300)">Go to homepage</a></p>
    </div>
  </main>
</body>
</html>
